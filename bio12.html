<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Biology 12 Practice Test</title>
<style>
  :root{
    --bg:#f6f7fb; --ink:#0f172a; --muted:#64748b; --card:#fff; --line:#e6e9f0; --accent:#2563eb;
  }
  *{box-sizing:border-box}
  body{
    margin:0; font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); padding-bottom:90px;
  }
  header{padding:28px 20px 10px; max-width:860px; margin:0 auto}
  header a{color:var(--accent); text-decoration:none; font-weight:600; font-size:14px}
  header h1{margin:10px 0 6px; font-size:clamp(26px,4vw,38px); letter-spacing:-.02em}
  header p{margin:0; color:var(--muted); line-height:1.5}
  main{max-width:860px; margin:0 auto; padding:16px 20px 40px}
  .q{
    background:var(--card); border:1px solid var(--line); border-radius:16px;
    padding:18px; margin-bottom:14px; box-shadow:0 1px 2px rgba(15,23,42,.04);
  }
  .q legend{font-weight:700; line-height:1.45; padding:0 4px}
  .q .num{
    display:inline-flex; align-items:center; justify-content:center;
    width:26px; height:26px; border-radius:8px; background:#e8efff; color:#1d4ed8;
    font-size:13px; margin-right:8px;
  }
  .options{margin-top:12px; display:grid; gap:8px}
  .option{
    display:flex; gap:10px; align-items:flex-start; padding:10px 12px;
    border:1px solid #e2e8f0; border-radius:12px; cursor:pointer; line-height:1.4;
    background:#fff; transition:background .12s, border-color .12s;
  }
  .option:hover{background:#f8fafc}
  .option input{margin-top:3px; accent-color:var(--accent)}
  .option.correct{background:#dcfce7; border-color:#22c55e}
  .option.wrong{background:#fee2e2; border-color:#ef4444}
  .explanation{
    margin-top:12px; padding:10px 12px; border-radius:12px; background:#f8fafc;
    border:1px solid var(--line); color:#334155; font-size:14px; line-height:1.5;
  }
  .actions{display:flex; gap:10px; flex-wrap:wrap; margin:20px 0}
  .actions button{
    appearance:none; border:0; border-radius:12px; padding:12px 20px; font-weight:700;
    font-size:15px; cursor:pointer; background:var(--accent); color:#fff;
  }
  .actions button.secondary{background:#fff; color:var(--ink); border:1px solid #d7dce8}
  #score{font-weight:800; font-size:18px; margin:10px 0 0}
</style>
</head>
<body>
  <header>
    <a href="index.html">← Back to Grade 12 Practice Tests</a>
    <h1>Biology 12 Practice Test</h1>
    <p>30 multiple-choice questions. Choose one answer per question, then submit.</p>
  </header>

  <main>
    <form id="quiz"></form>
    <div class="actions">
      <button type="button" id="submitBtn">Submit Test</button>
      <button type="button" id="resetBtn" class="secondary">Reset</button>
    </div>
    <div id="score"></div>
  </main>

  <script src="tools.js"></script>
  <script>
    const QUESTIONS = [
      {
        q: "What is the main component of the cell membrane?",
        options: ["Phospholipid bilayer", "Cellulose wall", "Protein monolayer", "Cholesterol only"],
        answer: 0,
        exp: "The cell membrane is primarily a phospholipid bilayer with embedded proteins."
      },
      {
        q: "Which organelle is the main site of ATP production in aerobic respiration?",
        options: ["Ribosome", "Mitochondrion", "Golgi apparatus", "Lysosome"],
        answer: 1,
        exp: "Mitochondria contain the Krebs cycle enzymes and electron transport chain."
      },
      {
        q: "What is the function of ribosomes?",
        options: ["Lipid synthesis", "Protein synthesis", "DNA replication", "Waste breakdown"],
        answer: 1,
        exp: "Ribosomes translate mRNA into polypeptide chains."
      },
      {
        q: "DNA replication occurs during which phase of the cell cycle?",
        options: ["G1 phase", "S phase", "G2 phase", "M phase"],
        answer: 1,
        exp: "DNA is replicated during S phase (synthesis phase)."
      },
      {
        q: "How do enzymes increase reaction rate?",
        options: ["They increase activation energy", "They lower activation energy", "They change the products", "They add more substrate"],
        answer: 1,
        exp: "Enzymes lower the activation energy required for a reaction."
      },
      {
        q: "A competitive inhibitor works by:",
        options: ["Binding the active site", "Changing the substrate", "Denaturing the enzyme", "Increasing enzyme concentration"],
        answer: 0,
        exp: "Competitive inhibitors bind to the active site and compete with the substrate."
      },
      {
        q: "Where does glycolysis occur?",
        options: ["Mitochondrial matrix", "Cytoplasm", "Inner mitochondrial membrane", "Nucleus"],
        answer: 1,
        exp: "Glycolysis occurs in the cytoplasm."
      },
      {
        q: "What is the net ATP yield of glycolysis per glucose molecule?",
        options: ["0 ATP", "2 ATP", "4 ATP", "32 ATP"],
        answer: 1,
        exp: "Glycolysis uses 2 ATP and produces 4 ATP, for a net gain of 2 ATP."
      },
      {
        q: "Where does the Krebs cycle occur?",
        options: ["Cytoplasm", "Mitochondrial matrix", "Thylakoid membrane", "Nucleus"],
        answer: 1,
        exp: "The Krebs cycle occurs in the mitochondrial matrix."
      },
      {
        q: "The electron transport chain produces ATP mainly through:",
        options: ["Substrate-level phosphorylation", "Oxidative phosphorylation", "Photolysis", "Fermentation"],
        answer: 1,
        exp: "The electron transport chain drives oxidative phosphorylation via chemiosmosis."
      },
      {
        q: "What is the final electron acceptor in aerobic respiration?",
        options: ["NAD+", "Oxygen", "Carbon dioxide", "Lactate"],
        answer: 1,
        exp: "Oxygen accepts electrons at the end of the electron transport chain."
      },
      {
        q: "Anaerobic respiration in human muscle produces:",
        options: ["Ethanol", "Lactate", "Carbon dioxide only", "Glucose"],
        answer: 1,
        exp: "Human muscle cells convert pyruvate to lactate during anaerobic respiration."
      },
      {
        q: "Where do the light reactions of photosynthesis occur?",
        options: ["Thylakoid membrane", "Stroma", "Cytoplasm", "Mitochondrial matrix"],
        answer: 0,
        exp: "Light reactions occur in the thylakoid membranes of chloroplasts."
      },
      {
        q: "The Calvin cycle uses which molecule as a carbon source?",
        options: ["Oxygen", "CO₂", "Glucose", "ATP"],
        answer: 1,
        exp: "The Calvin cycle fixes CO₂ into organic molecules."
      },
      {
        q: "In DNA, adenine pairs with:",
        options: ["Guanine", "Thymine", "Cytosine", "Uracil"],
        answer: 1,
        exp: "Adenine pairs with thymine in DNA."
      },
      {
        q: "Transcription produces:",
        options: ["mRNA", "Protein", "DNA", "Lipid"],
        answer: 0,
        exp: "Transcription uses DNA as a template to make mRNA."
      },
      {
        q: "Translation occurs at the:",
        options: ["Nucleus", "Ribosome", "Golgi apparatus", "Lysosome"],
        answer: 1,
        exp: "Translation is the process of building a polypeptide at the ribosome."
      },
      {
        q: "A codon codes for:",
        options: ["One amino acid", "One lipid", "One chromosome", "One organelle"],
        answer: 0,
        exp: "A codon is a three-base sequence that specifies one amino acid."
      },
      {
        q: "A substitution mutation involves:",
        options: ["One base being replaced", "A base being deleted", "A base being inserted", "A whole chromosome being lost"],
        answer: 0,
        exp: "A substitution replaces one nucleotide with another."
      },
      {
        q: "What is the normal pH range of human blood?",
        options: ["6.0–6.5", "7.35–7.45", "7.8–8.2", "5.5–6.0"],
        answer: 1,
        exp: "Human blood is normally kept between pH 7.35 and 7.45."
      },
      {
        q: "Red blood cells carry oxygen mainly using:",
        options: ["Hemoglobin", "Insulin", "Collagen", "Albumin"],
        answer: 0,
        exp: "Hemoglobin in red blood cells binds oxygen."
      },
      {
        q: "The SA node is important because it:",
        options: ["Acts as the heart's pacemaker", "Filters blood", "Produces insulin", "Digests proteins"],
        answer: 0,
        exp: "The sinoatrial node initiates electrical impulses that set heart rate."
      },
      {
        q: "Cardiac output is calculated as:",
        options: ["Heart rate × stroke volume", "Stroke volume ÷ heart rate", "Blood pressure × heart rate", "Tidal volume × breathing rate"],
        answer: 0,
        exp: "Cardiac output = heart rate × stroke volume."
      },
      {
        q: "Filtration of blood in the kidney begins at the:",
        options: ["Glomerulus", "Loop of Henle", "Collecting duct", "Bladder"],
        answer: 0,
        exp: "The glomerulus filters blood into the renal tubule."
      },
      {
        q: "Most reabsorption in the nephron occurs in the:",
        options: ["Proximal tubule", "Distal tubule", "Collecting duct", "Ureter"],
        answer: 0,
        exp: "The proximal tubule reabsorbs most water, ions, and nutrients."
      },
      {
        q: "ADH increases:",
        options: ["Water reabsorption", "Sodium excretion", "Glucose filtration", "Protein digestion"],
        answer: 0,
        exp: "Antidiuretic hormone increases water reabsorption in the collecting duct."
      },
      {
        q: "Insulin lowers blood glucose by:",
        options: ["Increasing glucose uptake by cells", "Breaking down glucose", "Increasing glucagon", "Stopping digestion"],
        answer: 0,
        exp: "Insulin promotes glucose uptake and storage, lowering blood glucose."
      },
      {
        q: "At resting potential, the inside of a neuron is:",
        options: ["Negatively charged relative to outside", "Positively charged relative to outside", "Neutral", "Same as outside"],
        answer: 0,
        exp: "Resting neurons are polarized with a negative inside relative to the outside."
      },
      {
        q: "During an action potential, which ion rushes into the neuron?",
        options: ["Na⁺", "K⁺", "Cl⁻", "Ca²⁺"],
        answer: 0,
        exp: "Voltage-gated sodium channels open and Na⁺ enters, causing depolarization."
      },
      {
        q: "As a cell increases in size, its surface area to volume ratio:",
        options: ["Increases", "Decreases", "Stays the same", "Becomes zero"],
        answer: 1,
        exp: "Larger cells have relatively less surface area per unit volume, making exchange less efficient."
      }
    ];

    const form = document.getElementById("quiz");
    const scoreEl = document.getElementById("score");
    let submitted = false;

    function renderQuiz() {
      form.innerHTML = QUESTIONS.map(function (item, i) {
        return `
          <fieldset class="q" data-q="${i}">
            <legend><span class="num">${i + 1}</span>${item.q}</legend>
            <div class="options">
              ${item.options.map(function (opt, j) {
                return `
                  <label class="option">
                    <input type="radio" name="q${i}" value="${j}" />
                    <span>${opt}</span>
                  </label>
                `;
              }).join("")}
            </div>
            <div class="explanation" hidden></div>
          </fieldset>
        `;
      }).join("");
    }

    function submitQuiz() {
      let score = 0;
      submitted = true;

      QUESTIONS.forEach(function (item, i) {
        const fieldset = form.querySelector('[data-q="' + i + '"]');
        const labels = fieldset.querySelectorAll(".option");
        const selected = form.querySelector('input[name="q' + i + '"]:checked');
        const explanation = fieldset.querySelector(".explanation");

        labels.forEach(function (label) {
          label.classList.remove("correct", "wrong");
        });

        if (selected) {
          const selectedLabel = selected.closest(".option");
          if (Number(selected.value) === item.answer) {
            score++;
            selectedLabel.classList.add("correct");
          } else {
            selectedLabel.classList.add("wrong");
            labels[item.answer].classList.add("correct");
          }
        } else {
          labels[item.answer].classList.add("correct");
        }

        explanation.hidden = false;
        explanation.textContent = "Answer: " + item.options[item.answer] + ". " + item.exp;
      });

      scoreEl.textContent = "Score: " + score + " / " + QUESTIONS.length;
      scoreEl.scrollIntoView({ behavior: "smooth", block: "center" });
    }

    function resetQuiz() {
      submitted = false;
      form.reset();
      form.querySelectorAll(".option").forEach(function (label) {
        label.classList.remove("correct", "wrong");
      });
      form.querySelectorAll(".explanation").forEach(function (el) {
        el.hidden = true;
        el.textContent = "";
      });
      scoreEl.textContent = "";
    }

    document.getElementById("submitBtn").addEventListener("click", submitQuiz);
    document.getElementById("resetBtn").addEventListener("click", resetQuiz);

    renderQuiz();
  </script>
</body>
</html>
