<style>

.subject-badge.chemistry,.subject-badge.math,.subject-badge.generic{background:var(--pt-accent-soft);border-color:var(--pt-accent-border);box-shadow:0 0 18px var(--pt-glow-2)}

.t button.pt-continue{color:var(--pt-on-accent);background:linear-gradient(135deg,var(--pt-accent-primary),var(--pt-accent-secondary));box-shadow:0 6px 20px var(--pt-shadow)}
.t button.pt-continue:hover{filter:brightness(1.1);box-shadow:0 10px 26px var(--pt-glow-2)}
.t a.pt-open:active,.t button.pt-continue:active{transform:scale(.98)}
.t .pt-last{color:var(--mut);font-size:.78rem}

@media (max-width:600px){main{padding:26px 12px 56px}.t{padding:17px}.t-art{width:92px;height:92px;top:6px;right:6px}}

.pt-ring .pt-ring-label{fill:var(--pt-text);font-size:12px;font-weight:800;font-family:inherit;letter-spacing:-.03em}

html[data-pt-theme="light"] .pt-ring .pt-ring-track{stroke:var(--pt-border)}
.t:hover{border-color:var(--pt-accent-primary);box-shadow:0 20px 48px var(--pt-shadow),inset 0 0 0 1px var(--pt-accent-soft),0 0 34px var(--pt-glow-1)}

<body>
<main>
<div class="hero">
<span class="eyebrow">✦ Study workspace</span>
<p class="pt-greeting" id="pt-greeting"></p>
<h1>Grade 12 Practice Tests</h1>
<p class="pt-greeting-sub" id="pt-greeting-sub"></p>
<p class="sub">Pick a subject and a test to start — your progress stays in sync.</p>
</div>
<p class="pt-settings-tip">Tip: Your progress auto-saves to the cloud. You can reset any test anytime in Settings (⚙️).</p>
<div class="grid" id="g"></div>
</main>
<script src="tests-registry.js"></script>
<script src="auth.js"></script>
<script>
// All test metadata lives in tests-registry.js (window.PT_TESTS).
const MOTIFS=['physics','biology','chemistry','math','generic'];
const TESTS=(window.PT_TESTS||[]).map(function(t){
  const motif=MOTIFS.indexOf(t.motif)>=0?t.motif:'generic';
  return {
    title:t.title,
    desc:t.description||'',
    href:t.url,
    testId:t.id,
    total:t.totalQuestions||0,
    subject:motif,
    icon:t.badgeIcon||'✦',
    badge:t.subject||t.title||'Test'
  };
});
const ART={
  physics:'<svg class="t-art physics-art" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="62" cy="64" r="7"/><path d="M62 64 24 28"/><path d="M18 36 24 28 33 33"/><path d="M62 64 104 32"/><path d="M97 29 105 31 103 39"/><path d="M62 64 88 103"/><path d="M83 96 88 104 96 100"/><path d="M40 84a32 32 0 0 1 40-38"/><path d="M80 46 78 38 70 40"/></g></svg>',
  biology:'<svg class="t-art biology-art" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 62h24l8-18 10 36 10-27 8 9h48"/><path d="M38 18c24 10 24 74 0 84"/><path d="M82 18c-24 10-24 74 0 84"/><path d="M45 30h30M42 45h36M42 75h36M45 90h30"/></g></svg>',
  chemistry:'<svg class="t-art chemistry-art" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M48 16h24M54 16v28L28 96a8 8 0 0 0 7 12h50a8 8 0 0 0 7-12L66 44V16"/><path d="M39 76h42"/><circle cx="53" cy="86" r="3"/><circle cx="70" cy="91" r="2"/></g></svg>',
  math:'<svg class="t-art math-art" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 96h88M24 96V24"/><path d="M32 84c14 0 18-48 32-48s14 48 30 48"/><path d="M72 24h28M86 10v28"/><circle cx="32" cy="84" r="3"/><circle cx="64" cy="36" r="3"/><circle cx="94" cy="84" r="3"/></g></svg>',
  generic:'<svg class="t-art generic-art" viewBox="0 0 120 120" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><rect x="22" y="22" width="76" height="76" rx="14"/><path d="M22 47h76M47 22v76"/><path d="M62 62h18M71 53v18"/></g></svg>'
};
const g=document.getElementById('g');
function qLabel(id){
  if(!id)return '';
  return /^Q\d+$/.test(id)?id:(id.charAt(0)==='W'?'Written '+id.slice(1):id);
}
TESTS.forEach((t,idx)=>{
  const card=document.createElement('div');card.className='t art-'+t.subject;
  card.style.animationDelay=(idx*0.09)+'s';
  const ring='<span class="pt-mastery-ring" title="0% complete · 0% accuracy">'+
    '<svg class="pt-ring" viewBox="0 0 52 52" aria-hidden="true">'+
      '<circle class="pt-ring-track" cx="26" cy="26" r="21"></circle>'+
      '<circle class="pt-ring-progress pt-ring-completion" cx="26" cy="26" r="21"></circle>'+
      '<circle class="pt-ring-track pt-ring-track-inner" cx="26" cy="26" r="15"></circle>'+
      '<circle class="pt-ring-progress pt-ring-accuracy" cx="26" cy="26" r="15"></circle>'+
      '<text class="pt-ring-label" x="26" y="29.5" text-anchor="middle">0%</text>'+
    '</svg></span>';
  card.innerHTML=(ART[t.subject]||ART.generic)+'<div class="t-head"><span class="subject-badge '+t.subject+'">'+t.icon+' '+t.badge+'</span>'+ring+'</div>'+
    '<b><a href="'+t.href+'"></a></b><span class="t-desc"></span>'+
    '<div class="t-actions"><a class="pt-open" href="'+t.href+'">Open Test →</a><span class="pt-continue-slot"></span><span class="pt-flag-review-slot"></span></div>'+
    '<div class="pt-stats-card" data-stats></div>';
  card.querySelector('b a').textContent=t.title;
  card.querySelector('.t-desc').textContent=t.desc;
  card.addEventListener('pointermove',function(e){
    const r=card.getBoundingClientRect();
    card.style.setProperty('--mx',(((e.clientX-r.left)/r.width)*100).toFixed(1)+'%');
    card.style.setProperty('--my',(((e.clientY-r.top)/r.height)*100).toFixed(1)+'%');
  });
  card.addEventListener('pointerleave',function(){
    card.style.removeProperty('--mx');card.style.removeProperty('--my');
  });
  g.appendChild(card);t.el=card;
  const box=card.querySelector('[data-stats]');
  box.addEventListener('click',function(e){
    const b=e.target.closest('button[data-scope]');
    if(!b)return;
    PTProgress.setLaunchFilter(t.testId,{mode:'incorrect',scope:b.dataset.scope,subcategoryId:b.dataset.scope});
    location.href=t.href;
  });
});
const s=document.createElement('div');s.className='t soon';s.style.animationDelay=(TESTS.length*0.09)+'s';s.textContent='More tests coming soon';g.appendChild(s);

async function refreshProgress(){
  const [all,flagMap]=await Promise.all([PTProgress.rows(),PTProgress.flagCounts()]);
  TESTS.forEach(t=>{
    const box=t.el&&t.el.querySelector('[data-stats]');
    if(!box)return;
    const row=all[t.testId],stats=row&&row.__stats;
    box.innerHTML=stats?PTProgress.statsHTML(stats,{menu:true}):
      '<p class="pt-stats-empty">No progress yet — start the test to track Correct / Incorrect / %.</p>';

    const o=stats&&stats.overall;
    const answered=o?o.answered:PTProgress.countAnswers(row);
    const total=o?o.total:t.total; // t.total comes from PT_TESTS.totalQuestions until progress exists
    const completion=total?Math.min(100,Math.round(answered/total*100)):0;
    const accuracy=o&&o.answered?Math.round(o.correct/o.answered*100):0;
    const ring=t.el.querySelector('.pt-mastery-ring');
    if(ring){
      const completionArc=ring.querySelector('.pt-ring-completion');
      const accuracyArc=ring.querySelector('.pt-ring-accuracy');
      if(completionArc)completionArc.style.strokeDashoffset=(131.95*(1-completion/100)).toFixed(2);
      if(accuracyArc)accuracyArc.style.strokeDashoffset=(94.25*(1-accuracy/100)).toFixed(2);
      const label=ring.querySelector('.pt-ring-label');if(label)label.textContent=accuracy+'%';
      ring.title=completion+'% complete · '+accuracy+'% accuracy';
    }

    const slot=t.el.querySelector('.pt-continue-slot');slot.innerHTML='';
    if(answered>0&&answered<total){
      const nextId=stats&&(stats.nextQuestionId||stats.lastQuestionId);
      const b=document.createElement('button');
      b.type='button';b.className='pt-continue';
      b.textContent='Continue Where You Left Off'+(nextId?' ('+qLabel(nextId)+')':'')+' →';
      b.onclick=function(){PTProgress.setContinue(t.testId);location.href=t.href};
      slot.appendChild(b);
      if(stats&&stats.lastQuestionId){
        const last=document.createElement('span');last.className='pt-last';
        last.textContent='Last worked on: '+qLabel(stats.lastQuestionId);
        slot.appendChild(last);
      }
    }

    const flagSlot=t.el.querySelector('.pt-flag-review-slot');flagSlot.innerHTML='';
    const flagCount=flagMap[t.testId]||0;
    if(flagCount>0){
      const fb=document.createElement('button');
      fb.type='button';fb.className='pt-review-flag-btn';
      fb.textContent='⚑ Review Flagged ('+flagCount+')';
      fb.onclick=function(){PTProgress.setLaunchFilter(t.testId,{mode:'flagged'});location.href=t.href};
      flagSlot.appendChild(fb);
    }
  });
}
PTAuth.init({
  onUnlock:function(){PTCommunity.render();refreshProgress()},
  onLock:function(){PTCommunity.render();refreshProgress()}
});
document.addEventListener('pt-progress-reset',function(){PTCommunity.render();refreshProgress()});
</script>
