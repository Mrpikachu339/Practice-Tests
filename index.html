<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Grade 12 Practice Tests</title>
<style>
:root{--bg:#f4f6fb;--card:#fff;--tx:#1b2133;--mut:#5b6478;--line:#d9deea;--pri:#3b5bdb;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root{--bg:#12151f;--card:#1c2030;--tx:#e8ebf4;--mut:#9aa3b8;--line:#33394f;--pri:#6c8cff;color-scheme:dark}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;line-height:1.5}
main{max-width:760px;margin:0 auto;padding:28px 16px 48px}
h1{font-size:1.7rem;margin:0 0 4px}
.sub{color:var(--mut);margin:0 0 22px}
.grid{display:grid;gap:12px}
.t{display:block;text-decoration:none;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px}
.t:hover{border-color:var(--pri)}
.t>b{font-size:1.1rem}
.t>b a{color:inherit;text-decoration:none}
.t>b a:hover{text-decoration:underline}
.t>span{display:block;color:var(--mut);margin-top:4px;font-size:.92rem}
.t>i{display:block;color:var(--pri);font-style:normal;font-weight:600;margin-top:8px}
.t .t-actions{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:10px}
.t a.pt-open,.t button.pt-continue{display:inline-block;border:1px solid var(--pri);border-radius:999px;padding:7px 13px;font-size:.86rem;font-weight:700;text-decoration:none;cursor:pointer;font-family:inherit;white-space:nowrap}
.t a.pt-open{color:var(--pri);background:transparent}
.t a.pt-open:hover{background:rgba(59,130,246,.10)}
.t button.pt-continue{color:#fff;background:var(--pri)}
.t button.pt-continue:hover{filter:brightness(.94)}
.t .pt-last{color:var(--mut);font-size:.78rem}
.soon{border-style:dashed;color:var(--mut);opacity:.7}
</style>
</head>
<body>
<main>
<h1>Grade 12 Practice Tests</h1>
<p class="sub">Pick a subject and a test to start.</p>
<div class="grid" id="g"></div>
</main>
<script src="auth.js"></script>
<script>
// To add a test: make a new test page (keep the tools.js script tag in it), then add one line here.
const TESTS=[
 {title:'Physics 12 — Static Equilibrium Practice Test',desc:'33 multiple choice and 11 written questions. Calculator, formula sheet and drawing pad included.',href:'physics-equilibrium-test.html',testId:'physics-equilibrium',total:44},
 {title:'Biology 12 — Digestion, Circulation & Respiration Practice Test',desc:'Digestion, Circulation & Respiration • 180 Questions',href:'biology-12-digestion-circulation-respiration-test.html',testId:'biology-12-digestion-circulation-respiration',total:180}
];
const g=document.getElementById('g');
function qLabel(id){
  if(!id)return '';
  return /^Q\d+$/.test(id)?id:(id.charAt(0)==='W'?'Written '+id.slice(1):id);
}
TESTS.forEach(t=>{
  const card=document.createElement('div');card.className='t';
  card.innerHTML='<b><a href="'+t.href+'"></a></b><span></span>'+
    '<div class="t-actions"><a class="pt-open" href="'+t.href+'">Open Test →</a><span class="pt-continue-slot"></span></div>'+
    '<div class="pt-stats-card" data-stats></div>';
  card.querySelector('b a').textContent=t.title;
  card.querySelector('span').textContent=t.desc;
  g.appendChild(card);t.el=card;
  const box=card.querySelector('[data-stats]');
  box.addEventListener('click',function(e){
    const b=e.target.closest('button[data-scope]');
    if(!b)return;
    PTProgress.setLaunchFilter(t.testId,{mode:'incorrect',scope:b.dataset.scope,subcategoryId:b.dataset.scope});
    location.href=t.href;
  });
});
const s=document.createElement('div');s.className='t soon';s.style.cssText='padding:16px;border:1px dashed var(--line);border-radius:14px';s.textContent='More tests coming soon';g.appendChild(s);

async function refreshProgress(){
  const all=await PTProgress.rows();
  TESTS.forEach(t=>{
    const box=t.el&&t.el.querySelector('[data-stats]');
    if(!box)return;
    const row=all[t.testId],stats=row&&row.__stats;
    box.innerHTML=stats?PTProgress.statsHTML(stats,{menu:true}):
      '<p class="pt-stats-empty">No progress yet — start the test to track Correct / Incorrect / %.</p>';

    const slot=t.el.querySelector('.pt-continue-slot');slot.innerHTML='';
    const o=stats&&stats.overall;
    const answered=o?o.answered:PTProgress.countAnswers(row);
    const total=o?o.total:t.total;
    if(answered>0&&answered<total){
      const nextId=stats&&(stats.nextQuestionId||stats.lastQuestionId);
      const b=document.createElement('button');
      b.type='button';b.className='pt-continue';
      b.textContent='Continue Where You Left Off'+(nextId?' ('+qLabel(nextId)+')':'')+' →';
      b.onclick=function(){PTProgress.setContinue(t.testId);location.href=t.href};
      slot.appendChild(b);
      if(stats&&stats.lastQuestionId){
        const last=document.createElement('span');last.className='pt-last';
        last.textContent='Last worked on: '+qLabel(stats.lastQuestionId);
        slot.appendChild(last);
      }
    }
  });
}
PTAuth.init({onUnlock:refreshProgress,onLock:refreshProgress});
</script>
</body>
</html>
