<script>
/* Question data: every problem from the assignment PDF, in source order.
   Answers and worked solutions are transcribed from the authoritative answer
   key PDF (verified by content, since that key renumbers several items). */
const F=(n,d)=>'<span class="frac"><span>'+n+'</span><span>'+d+'</span></span>';
const L=v=>'<span class="lim"><span class="limop">lim</span><span class="limunder">'+v+'</span></span>';
const RT=(x,i)=>'<span class="rad">'+(i?'<sup class="ridx">'+i+'</sup>':'')+'√<span class="radicand">'+x+'</span></span>';
const Q=[
  {id:'W1',label:'1',t:'w',topic:'continuity',keyRef:'Answer key §1 — “|f(x)| is continuous”',
   qhtml:`<p>Prove that if <span class="math-inline">f(x)</span> is continuous on an interval, then so is <span class="math-inline">|f(x)|</span>.</p><p class="hint">Show all your work. Clearly indicate the methods you use, and use complete sentences for your explanation.</p>`,
   a:`<span class="ansline">|f(x)| is continuous on the interval. (Proved.)</span>`,
   e:`<ol class="steps"><li>Let <span class="math-inline">g(x)=|x|</span>. The absolute-value function <span class="math-inline">g</span> is continuous everywhere.</li><li>The function <span class="math-inline">f</span> is continuous on the interval by hypothesis.</li><li>A composition of continuous functions is continuous, so <span class="math-inline">g(f(x))=|f(x)|</span> is continuous on that interval.</li></ol>`},
  {id:'W2',label:'2(a)',t:'w',topic:'algebraic',keyRef:'Answer key §2(a) — Answer: 11',
   qhtml:`<p>Compute the following limit. If a limit does not exist, explain why.</p><div class="math">${L('x→5')}${F('2x<sup>2</sup>−9x−5','x−5')}</div>`,
   a:`<span class="ansline">11</span>`,
   e:`<ol class="steps"><li>Factor the numerator: <span class="math-inline">2x<sup>2</sup>−9x−5=(x−5)(2x+1)</span>.</li><li>Cancel the common factor <span class="math-inline">x−5</span> (valid for <span class="math-inline">x≠5</span>).</li><li>Plug in <span class="math-inline">x=5</span>: <span class="math-inline">2(5)+1=11</span>.</li></ol>`},
  {id:'W3',label:'2(b)',t:'w',topic:'algebraic',keyRef:'Answer key §2(b) — Answer: 1/10',
   qhtml:`<p>Compute the following limit. If a limit does not exist, explain why.</p><div class="math">${L('x→−2')}${F(RT('x+27')+'−5','x+2')}</div>`,
   a:`<span class="ansline">${F('1','10')}</span>`,
   e:`<ol class="steps"><li>Multiply the numerator and denominator by the conjugate <span class="math-inline">${RT('x+27')}+5</span>.</li><li>The numerator becomes <span class="math-inline">(x+27)−25=x+2</span>, which cancels with the denominator’s <span class="math-inline">x+2</span>.</li><li>Plug in <span class="math-inline">x=−2</span>: <span class="math-inline">${F('1',RT('25')+'+5')}=${F('1','10')}</span>.</li></ol>`},
  {id:'W4',label:'2(c)',t:'w',topic:'onesided',keyRef:'Answer key §2(c) — Answer: does not exist',
   qhtml:`<p>Compute the following limit. If a limit does not exist, explain why.</p><div class="math">${L('x→1')}${F('3x<sup>2</sup>+5x−2','|3x−1|')}</div>`,
   a:`<span class="ansline">Does not exist (DNE)</span>`,
   e:`<ol class="steps"><li>Factor: <span class="math-inline">3x<sup>2</sup>+5x−2=(3x−1)(x+2)</span>.</li><li>From the left, <span class="math-inline">3x−1&lt;0</span>, so <span class="math-inline">|3x−1|=−(3x−1)</span> and the limit is <span class="math-inline">−(x+2)→−${F('7','3')}</span>.</li><li>From the right, <span class="math-inline">|3x−1|=3x−1</span> and the limit is <span class="math-inline">x+2→${F('7','3')}</span>.</li><li>The one-sided limits are different, so the two-sided limit does not exist.</li></ol>`},
  {id:'W5',label:'2(d)',t:'w',topic:'algebraic',keyRef:'Answer key §2(d) — Answer: 1/4',
   qhtml:`<p>Compute the following limit. If a limit does not exist, explain why.</p><div class="math">${L('x→π/4')}${F('cos θ−sin θ','(cos θ)(1−tan<sup>4</sup> θ)')}</div>`,
   a:`<span class="ansline">${F('1','4')}</span>`,
   e:`<ol class="steps"><li>Rewrite the denominator: <span class="math-inline">cos θ(1−tan<sup>4</sup> θ)=(cos<sup>4</sup> θ−sin<sup>4</sup> θ)/cos<sup>3</sup> θ</span>.</li><li>Factor: <span class="math-inline">cos<sup>4</sup> θ−sin<sup>4</sup> θ=(cos<sup>2</sup> θ−sin<sup>2</sup> θ)(cos<sup>2</sup> θ+sin<sup>2</sup> θ)=(cos θ−sin θ)(cos θ+sin θ)</span>.</li><li>Cancel <span class="math-inline">cos θ−sin θ</span>; what remains is <span class="math-inline">cos<sup>3</sup> θ/(cos θ+sin θ)</span>.</li><li>At <span class="math-inline">θ=π/4</span>: <span class="math-inline">(${RT('2')}/2)<sup>3</sup>/${RT('2')}=(${RT('2')}/4)/${RT('2')}=${F('1','4')}</span>.</li></ol>`},
  {id:'W6',label:'2(e)',t:'w',topic:'infinity',keyRef:'Answer key §2(e) — Answer: −2∛2',
   qhtml:`<p>Compute the following limit. If a limit does not exist, explain why.</p><div class="math">${L('x→−∞')}${F(RT('16x<sup>3</sup>−90',3),'3−x')}</div>`,
   a:`<span class="ansline">−2${RT('2',3)}</span>`,
   e:`<ol class="steps"><li>The expression is <span class="math-inline">${F(RT('16x<sup>3</sup>−90',3),'3−x')}</span>.</li><li>Divide the top and bottom by <span class="math-inline">x</span>. For the cube root, <span class="math-inline">x=${RT('x<sup>3</sup>',3)}</span>, so the numerator becomes <span class="math-inline">${RT('16−90/x<sup>3</sup>',3)}→${RT('16',3)}=2${RT('2',3)}</span>.</li><li>The denominator becomes <span class="math-inline">3/x−1→−1</span>.</li><li>Therefore the limit is <span class="math-inline">2${RT('2',3)}/(−1)=−2${RT('2',3)}</span>.</li></ol>`},
  {id:'W7',label:'2(f)',t:'w',topic:'infinity',keyRef:'Answer key §2(f) — Answer: −1/3',
   qhtml:`<p>Compute the following limit. If a limit does not exist, explain why.</p><div class="math">${L('x→∞')}${F('4e<sup>5x</sup>+2e<sup>x</sup>+x<sup>3</sup>','3e<sup>3x</sup>−12e<sup>5x</sup>')}</div>`,
   a:`<span class="ansline">−${F('1','3')}</span>`,
   e:`<ol class="steps"><li>Divide the numerator and denominator by <span class="math-inline">e<sup>5x</sup></span>.</li><li>Numerator: <span class="math-inline">4+2e<sup>−4x</sup>+x<sup>3</sup>e<sup>−5x</sup>→4</span>.</li><li>Denominator: <span class="math-inline">3e<sup>−2x</sup>−12→−12</span>.</li><li>Therefore the limit is <span class="math-inline">4/(−12)=−${F('1','3')}</span>.</li></ol>`},
  {id:'W8',label:'3',t:'w',topic:'squeeze',keyRef:'Answer key §3 — Answer: 0',
   qhtml:`<p>Use the squeeze theorem to find the following limit.</p><div class="math">${L('x→0')}x<sup>4</sup> sin (${F('3','x')})</div>`,
   a:`<span class="ansline">0</span>`,
   e:`<ol class="steps"><li>Since <span class="math-inline">−1≤sin(3/x)≤1</span> and <span class="math-inline">x<sup>4</sup>≥0</span>, we have <span class="math-inline">−x<sup>4</sup>≤x<sup>4</sup>sin(3/x)≤x<sup>4</sup></span>.</li><li>Both bounds approach 0: <span class="math-inline">lim(−x<sup>4</sup>)=lim(x<sup>4</sup>)=0</span>.</li><li>By the squeeze theorem, the limit is <span class="math-inline">0</span>.</li></ol>`},
  {id:'W9',label:'4',t:'w',topic:'continuity',keyRef:'Answer key §3b (discontinuities) — Removable at x=0 and x=−1',
   qhtml:`<p>Find the points of discontinuity of the function (if any) and describe their types.</p><div class="math">f(x)=${F('x<sup>4</sup>−4x<sup>3</sup>−5x<sup>2</sup>','x<sup>2</sup>+x')}</div>`,
   a:`<span class="ansline">Removable discontinuities (holes) at x=0 and x=−1. There are no others.</span>`,
   e:`<ol class="steps"><li>Factor the numerator: <span class="math-inline">x<sup>2</sup>(x−5)(x+1)</span>; factor the denominator: <span class="math-inline">x(x+1)</span>.</li><li>Cancelling <span class="math-inline">x(x+1)</span> leaves <span class="math-inline">x(x−5)</span>.</li><li>Both cancelled factors give holes: at <span class="math-inline">(0,0)</span> and at <span class="math-inline">(−1,6)</span>. Since both factors cancel, the discontinuities are removable and there are no others.</li></ol>`},
  {id:'W10',label:'5',t:'w',topic:'continuity',keyRef:'Answer key §4 — f cannot be continuous (IVT)',
   qhtml:`<p>A function <span class="math-inline">f: [−5,5]→R</span> has two zeros on its domain and the following (incomplete) list of points.</p>
   <div class="ptable-wrap"><table class="ptable"><thead><tr><th>x</th><th>−5</th><th>−4</th><th>−3</th><th>−2</th><th>−1</th><th>0</th><th>1</th><th>2</th><th>3</th><th>4</th><th>5</th></tr></thead><tbody><tr><td>f(x)</td><td>4</td><td>1</td><td>−4</td><td>1</td><td>5</td><td>−3</td><td>−1</td><td>2</td><td>3</td><td>−2</td><td>−3</td></tr></tbody></table></div>
   <p>We use this information to conclude that <span class="math-inline">f(x)</span> is not continuous. Write a paragraph explaining the reasoning.</p>`,
   a:`<span class="ansline">f is not continuous.</span>`,
   e:`<ol class="steps"><li><span class="math-inline">f</span> changes sign on five separate intervals: <span class="math-inline">[−4,−3]</span> (1 to −4), <span class="math-inline">[−3,−2]</span> (−4 to 1), <span class="math-inline">[−1,0]</span> (5 to −3), <span class="math-inline">[1,2]</span> (−1 to 2), and <span class="math-inline">[3,4]</span> (3 to −2).</li><li>If <span class="math-inline">f</span> were continuous, the Intermediate Value Theorem would put at least one zero in each interval.</li><li>The intervals do not overlap, so <span class="math-inline">f</span> would have at least 5 zeros. But <span class="math-inline">f</span> has only 2 zeros, a contradiction. Therefore <span class="math-inline">f</span> is not continuous.</li></ol>`},
  {id:'W11',label:'6',t:'w',topic:'algebraic',keyRef:'Answer key — “Find A and B”: A = 3, B = 6',
   qhtml:`<p>Find the values of the constants <span class="math-inline">A</span> and <span class="math-inline">B</span> such that</p><div class="math">${L('x→0')}${F(RT('A+Bx')+'−'+RT('3'),'x')}=${RT('3')}</div>`,
   a:`<span class="ansline">A=3, B=6</span>`,
   e:`<ol class="steps"><li>If <span class="math-inline">A≠3</span>, the numerator approaches <span class="math-inline">${RT('A')}−${RT('3')}≠0</span> while the denominator approaches 0, so the limit blows up. Therefore <span class="math-inline">A=3</span>.</li><li>Multiply by the conjugate: <span class="math-inline">Bx/[x(${RT('3+Bx')}+${RT('3')})]=B/(${RT('3+Bx')}+${RT('3')})</span>.</li><li>As <span class="math-inline">x→0</span>, this becomes <span class="math-inline">B/(2${RT('3')})</span>.</li><li>Set <span class="math-inline">B/(2${RT('3')})=${RT('3')}</span>, which gives <span class="math-inline">B=6</span>.</li></ol>`},
  {id:'W12',label:'7',t:'w',topic:'squeeze',keyRef:'Answer key — “Evaluate … without l’Hôpital”: Answer 0',
   qhtml:`<p>Evaluate this limit without using l’Hôpital’s Rule.</p><div class="math">${L('x→0')}(${F('1','sin x')}−${F('1','x')})</div>`,
   a:`<span class="ansline">0</span>`,
   e:`<ol class="steps"><li>Combine terms: <span class="math-inline">1/sin x−1/x=(x−sin x)/(x sin x)</span>.</li><li>Right side <span class="math-inline">(0&lt;x&lt;π/2)</span>: <span class="math-inline">sin x&lt;x&lt;tan x</span>, so <span class="math-inline">0&lt;x−sin x&lt;tan x−sin x</span>.</li><li>Divide by <span class="math-inline">x sin x</span>: <span class="math-inline">0&lt;(x−sin x)/(x sin x)&lt;(tan x−sin x)/(x sin x)=(1−cos x)/(x cos x)</span>.</li><li>As <span class="math-inline">x→0<sup>+</sup></span>, <span class="math-inline">(1−cos x)/x→0</span> and <span class="math-inline">1/cos x→1</span>, so the upper bound tends to 0. By the squeeze theorem the right-hand limit is 0.</li><li>Left side: the function is odd, since <span class="math-inline">f(−x)=−f(x)</span>, so the left-hand limit is <span class="math-inline">−0=0</span>. Both one-sided limits equal 0, so the limit is <span class="math-inline">0</span>.</li></ol>
   <p class="knote">Answer-key note: in the source PDF the left-side inequality should read <span class="math-inline">sin x&gt;x&gt;tan x</span> for <span class="math-inline">−π/2&lt;x&lt;0</span>, not “0&gt;x&gt;π/2”.</p>`},

const PT=PTProgress.init({testId:'ap-calculus-limits-continuity',total:Q.length,catalog:CATALOG,

  set:s=>{answers=s.answers||{};flags=s.flags||{};lastQuestionId=s.lastQuestionId||''}
});
function hasAnswer(id){return Object.prototype.hasOwnProperty.call(answers,id)}
function noteMap(){if(!answers.__notes||typeof answers.__notes!=='object'||Array.isArray(answers.__notes))answers.__notes={};return answers.__notes}
function noteFor(id){return (answers.__notes&&answers.__notes[id])||''}
function saveNote(id,val){const notes=noteMap();if(val){if(notes[id]!==val){notes[id]=val;PT.changed();if(window.PTSound)PTSound.pop()}}else if(notes[id]){delete notes[id];PT.changed();if(window.PTSound)PTSound.pop()}}
function flushNote(){
  if(noteTimer){clearTimeout(noteTimer);noteTimer=null}
  if(noteDirtyId){const ta=document.getElementById('pt-note-text');if(ta)saveNote(noteDirtyId,ta.value);noteDirtyId=''}
}
function inScope(q,scope){return PTProgress.scopeMatches(QA[q.id],scope)}
function labelFor(scope){
  if(scope==='all')return 'Overall';
  if(scope.indexOf('format:')===0)return (FORMATS.find(c=>c.id===scope.slice(7))||{}).label||scope;
  if(scope.indexOf('topic:')===0){
    const parts=scope.split(':');
    const topic=(TOPICS.find(c=>c.id===parts[1])||{}).label||parts[1];
    if(!parts[2])return topic;
    const format=(FORMATS.find(c=>c.id===parts[2])||{}).label||parts[2];
    return topic+' — '+format;
  }
  return (TOPICS.find(c=>c.id===scope)||{}).label||scope;
}
function gradeOf(q){
  const v=answers[q.id];
  if(q.t==='mc')return !hasAnswer(q.id)?null:(v===q.a?'correct':'incorrect');
  if(v==='CORRECT'||v==='gotit')return 'correct';
  if(v==='INCORRECT'||v==='missit')return 'incorrect';
  return null;
}
function rightCount(list){return list.filter(q=>gradeOf(q)==='correct').length}
/* Consecutive correct answers immediately before the current question. */
function streakBefore(){let n=0;for(let k=i-1;k>=0;k--){if(gradeOf(queue[k])==='correct')n++;else break}return n}
function renderStreak(n,pop){
  const el=document.getElementById('streakBadge');if(!el)return;
  if(n>=2){
    const tier=n>=10?'crown':(n>=5?'fire':'warm');
    el.textContent=n>=10?('👑 '+n+' Unstoppable!'):(n>=5?('🔥 '+n+' On Fire!'):('✨ '+n+' Streak'));
    el.dataset.tier=tier;el.classList.add('on');
    if(pop){
      el.classList.remove('pt-streak-pop');void el.offsetWidth;el.classList.add('pt-streak-pop');
      if(n%5===0){
        if(window.PTSound)PTSound.streak();
        if(window.PTCelebrate&&PTCelebrate.streakMilestone)PTCelebrate.streakMilestone(n);
      }
    }
  }else{el.textContent='';delete el.dataset.tier;el.classList.remove('on','pt-streak-pop')}
}
function celebratePick(el,kind){
  if(window.PTSound){if(kind==='correct')PTSound.correct();else if(kind==='wrong')PTSound.wrong()}
  if(!el)return;
  if(kind==='correct'){
    el.classList.add('pt-correct-pop');
    if(window.PTCelebrate)PTCelebrate.burst(el,{count:20+Math.floor(Math.random()*9)});
  }else{
    el.classList.add('pt-wrong-shake');
    setTimeout(()=>el.classList.remove('pt-wrong-shake'),320);
  }
}
function missedIds(scope){return Q.filter(q=>inScope(q,scope)&&gradeOf(q)==='incorrect').map(q=>q.id)}
function wireStats(root){root.querySelectorAll('button[data-scope]').forEach(b=>b.onclick=()=>startRetry(b.dataset.scope))}

  const pct=Math.round(i/queue.length*100);
  const retryBanner=retryScope?`<div class="pt-stats-retry-banner"><span>Retry Mode: Practicing <strong>${retryCount}</strong> missed questions (${esc(retryLabel)})</span><button type="button" id="ptShowAll">Show All Questions</button></div>`:'';
  const flagBanner=flaggedReview?`<div class="pt-stats-retry-banner pt-flag-banner"><span>Flagged Review: Viewing <strong>${queue.length}</strong> flagged questions</span><button type="button" id="ptShowAll">Show All Questions</button></div>`:'';
  const banner=retryBanner+flagBanner;
  const cardCls=(flags[q.id]?' pt-card-flagged':'')+(hasAnswer(q.id)?' pt-card-answered':'')+(noteFor(q.id)?' pt-card-noted':'');
  let h=`${banner}${introRow()}<div class="row"><span>Question ${i+1} of ${queue.length} (${raw(q.label)})</span><span id="streakBadge" class="streak-badge"></span><span id="liveScore">Score: ${rightCount(queue)}</span></div>
  <div class="bar"><i style="width:${pct}%"></i></div>
  <div class="card${cardCls}"><div class="zrow"><button class="zbtn" id="zoom" style="${hasImg?'':'display:none'}">🔍 Zoom</button></div><span class="qtopic">${esc(labelFor('topic:'+q.topic))}</span><div class="qtext">${raw(q.qhtml)}</div>
  ${hasImg?`<div class="qimg" id="qimg"><img id="qi" alt="Question ${raw(q.label)}" src="${q.img}"></div>${q.imgCaption?'<div class="refl-caption">'+esc(q.imgCaption)+'</div>':''}`:''}
  <div class="pt-note-box" id="pt-note-box" hidden><label for="pt-note-text">📝 Personal note</label><textarea id="pt-note-text" rows="3" placeholder="Jot a memory trick or reminder..." spellcheck="true"></textarea><small>Auto-saved to your progress and synced to the cloud.</small></div>`;
  if(q.t==='mc'){
    h+=`<div class="choices">${['A','B','C','D'].map(l=>`<button data-l="${l}">${l}</button>`).join('')}</div><div id="out"></div>`;
  }else{
    h+=`<div id="out"><div class="act"><button class="p" id="rev">Show answer</button></div></div>`;
  }
  h+=`</div><div class="act pt-auth-act">${i<queue.length-1?'<button id="skip">Skip, send to end</button>':''}<button id="quit">Quit to menu</button><button type="button" id="pt-auth-flag" class="pt-auth-flag ${flags[q.id]?'pt-auth-on':''}">${flags[q.id]?'⚑ Flagged':'⚐ Flag'}</button><button type="button" id="pt-note" class="pt-auth-flag pt-note-btn${noteFor(q.id)?' has-note':''}">${noteFor(q.id)?'📝 <span class="pt-note-badge">📝</span> Note':'+ Note'}</button></div>`;
  app.innerHTML=h;
  wireScore(app);
  renderStreak(streakBefore(),false);
  window.scrollTo(0,0);
  document.getElementById('quit').onclick=home;
  const sa=document.getElementById('ptShowAll');if(sa)sa.onclick=showAll;
  (()=>{
    const zb=document.getElementById('zoom'),qimg=document.getElementById('qimg'),im=document.getElementById('qi');
    if(!hasImg){
      if(im){im.removeAttribute('src');im.style.display='none'}
      if(qimg)qimg.style.display='none';
      if(zb)zb.style.display='none';
      return;
    }
    const src=q.img;
    if(im){im.removeAttribute('src');im.setAttribute('src',src);im.style.display=''}
    if(qimg)qimg.style.display='';
    if(zb){zb.style.display='inline';zb.onclick=()=>zoomImg(src)}
    if(im)im.onclick=()=>zoomImg(src);
  })();
  const sk=document.getElementById('skip');if(sk)sk.onclick=skip;
  const fb=document.getElementById('pt-auth-flag');
  if(fb)fb.onclick=function(){
    if(window.PTSound)PTSound.flag();
    if(flags[q.id])delete flags[q.id];else flags[q.id]=true;
    const on=!!flags[q.id];
    fb.classList.toggle('pt-auth-on',on);fb.textContent=on?'⚑ Flagged':'⚐ Flag';
    PT.changed();
  };
  const nb=document.getElementById('pt-note'),noteBox=document.getElementById('pt-note-box'),nta=document.getElementById('pt-note-text');
  if(nta)nta.value=noteFor(q.id);
  if(nb&&noteBox&&nta){
    nb.onclick=function(){const open=noteBox.hidden;noteBox.hidden=!open;if(open)nta.focus()};
    nta.oninput=function(){
      noteDirtyId=q.id;
      if(noteTimer)clearTimeout(noteTimer);
      noteTimer=setTimeout(function(){
        const ta=document.getElementById('pt-note-text');
        if(ta&&noteDirtyId===q.id)saveNote(q.id,ta.value);
        noteDirtyId='';noteTimer=null;
        if(nb.isConnected){
          const has=!!noteFor(q.id);
          nb.classList.toggle('has-note',has);
          nb.innerHTML=has?'📝 <span class="pt-note-badge">📝</span> Note':'+ Note';
        }
      },350);
    };
    nta.onblur=function(){if(noteDirtyId===q.id)flushNote()};
  }
  if(q.t==='mc'){
    app.querySelectorAll('.choices button').forEach(b=>b.onclick=()=>pick(b.dataset.l));
    if(hasAnswer(q.id))pick(answers[q.id],true);
  }else{
    document.getElementById('rev').onclick=reveal;
    if(hasAnswer(q.id))document.getElementById('rev').textContent='Review answer';
  }
}
function pick(l,restored){
  if(answered&&!restored)return;
  answered=true;picked=l;rm();
  const q=queue[i],right=l===q.a;
  if(!restored){answers[q.id]=l;lastQuestionId=q.id;PT.changed()}
  app.querySelectorAll('.choices button').forEach(b=>{
    b.disabled=true;
    if(b.dataset.l===q.a)b.classList.add('ok');
    else if(b.dataset.l===l)b.classList.add('bad');
  });
  if(!restored){
    const chosen=Array.from(app.querySelectorAll('.choices button')).find(b=>b.dataset.l===l);
    if(right){celebratePick(chosen,'correct');renderStreak(streakBefore()+1,true)}
    else{celebratePick(chosen,'wrong');renderStreak(0,false)}
  }else renderStreak(streakBefore()+(right?1:0),false);
  document.getElementById('out').innerHTML=
   `<div class="fb ${right?'ok':'bad'}">${right?'You got it right!':'Not quite. You picked '+l+', the answer is '+q.a+'.'}
    <div class="ex"><b>${right?'Why it works':'Here’s where it went wrong'}</b>${raw(q.e)}</div>${q.keyRef?'<div class="keyref">'+esc(q.keyRef)+'</div>':''}</div>
    <div class="act"><button class="p" id="next">${i+1<queue.length?'Next question':'See results'}</button></div>`;
  document.getElementById('next').onclick=next;
  const ls=document.getElementById('liveScore');if(ls)ls.textContent='Score: '+rightCount(queue);
}
function reveal(){
  if(revealed)return;revealed=true;rm();
  const q=queue[i],v=answers[q.id];
  const g=(v==='CORRECT'||v==='gotit')?'correct':((v==='INCORRECT'||v==='missit')?'incorrect':null);
  document.getElementById('out').innerHTML=
   `<div class="fb ok" style="background:var(--ex);color:var(--tx)"><b>Answer</b><div class="ansline" style="margin-top:4px">${raw(q.a)}</div>
    <div class="ex" style="background:var(--card);border:1px solid var(--line)"><b>Worked solution</b>${raw(q.e)}${q.keyRef?'<div class="keyref">Verified: '+esc(q.keyRef)+'</div>':''}</div></div>
    <p class="hint">How did you do?</p>
    <div class="act pt-auth-act">
      <button type="button" class="pt-stats-grade correct${g==='correct'?' on':''}" data-grade="CORRECT">Mark Correct ✓</button>
      <button type="button" class="pt-stats-grade incorrect${g==='incorrect'?' on':''}" data-grade="INCORRECT">Mark Incorrect ✗</button>
    </div>
    <div class="act" id="gradeNext" style="${g?'':'display:none'}"><button class="p" id="next">${i+1<queue.length?'Next question':'See results'}</button></div>`;
  const wrap=document.getElementById('gradeNext');
  if(g)document.getElementById('next').onclick=next;
  document.querySelectorAll('[data-grade]').forEach(b=>b.onclick=()=>{
    const val=b.dataset.grade;
    if(answers[q.id]!==val){
      answers[q.id]=val;lastQuestionId=q.id;PT.changed();
      if(val==='CORRECT'){celebratePick(b,'correct');renderStreak(streakBefore()+1,true)}
      else{celebratePick(b,'wrong');renderStreak(0,false)}
    }
    document.querySelectorAll('[data-grade]').forEach(x=>x.classList.toggle('on',x===b));
    const ls=document.getElementById('liveScore');if(ls)ls.textContent='Score: '+rightCount(queue);
    if(wrap.style.display==='none'){wrap.style.display='';document.getElementById('next').onclick=next}
  });
}
function next(){
  i++;
  if(i<queue.length)show();else results();
}
function results(){
  const n=queue.length,right=rightCount(queue),wrong=queue.filter(q=>gradeOf(q)==='incorrect');
  const pct=n?Math.round(right/n*100):0;
  app.innerHTML=`<div class="pt-heading"><span class="subject-badge math">∫ AP Calculus</span></div><h1>Done!</h1><div class="card"><div class="big">${right} / ${n}</div><div class="sub" style="margin:0">${pct}% correct</div></div>
  ${wrong.length?`<div class="card"><b>Review these:</b><ul>${wrong.map(q=>`<li>${raw(q.label)} — ${esc(labelFor('topic:'+q.topic))}</li>`).join('')}</ul></div>`:''}
  <div class="act"><button class="p" id="home">Menu</button>${wrong.length?'<button type="button" id="retry">Retry missed ('+wrong.length+')</button>':''}${Object.keys(flags).length?'<button type="button" class="pt-review-flag-btn" data-flag-review>⚑ Review Flagged ('+Object.keys(flags).length+')</button>':''}</div>
  <div class="pt-stats-card" id="ptResultsStats"><p class="pt-stats-title">Score &amp; Subcategory Breakdown</p>${PTProgress.statsHTML(PT.stats())}</div>`;
  document.getElementById('home').onclick=home;
  const r=document.getElementById('retry');if(r)r.onclick=()=>startRetry('all');
  const rf=app.querySelector('[data-flag-review]');if(rf)rf.onclick=startFlaggedReview;
  wireStats(document.getElementById('ptResultsStats'));
  window.scrollTo(0,0);
  if(pct>=80&&n>0&&window.PTCelebrate)PTCelebrate.shower();
}
function startRetry(scope){
  const ids=missedIds(scope);
  if(!ids.length)return;
  flushNote();
  flaggedReview=false;
  retryCount=ids.length;retryScope=scope;retryLabel=labelFor(scope);
  PT.clearIncorrect(scope);
  const keep={};ids.forEach(id=>keep[id]=true);
  queue=Q.filter(q=>keep[q.id]);
  if(shuffle){for(let k=queue.length-1;k>0;k--){const j=Math.floor(Math.random()*(k+1));[queue[k],queue[j]]=[queue[j],queue[k]]}}
  i=0;show();
}
function startFlaggedReview(){
  const ids=Q.filter(q=>flags[q.id]).map(q=>q.id);
  if(!ids.length)return;
  flushNote();
  flaggedReview=true;retryScope=null;retryCount=0;retryLabel='';
  const keep={};ids.forEach(id=>keep[id]=true);
  queue=Q.filter(q=>keep[q.id]);
  i=0;show();
}
function showAll(){
  flaggedReview=false;retryScope=null;retryCount=0;retryLabel='';
  begin(Q.slice());
}
function applyLaunchFilter(){
  const f=PTProgress.takeLaunchFilter('ap-calculus-limits-continuity');
  if(f&&f.mode==='flagged'){startFlaggedReview();return true}
  if(f&&f.mode==='incorrect'){startRetry(f.scope||f.subcategoryId||'all');return true}
  return false;
}
function resumeQuestion(){
  const next=Q.find(q=>gradeOf(q)==null);
  if(next)return next;
  const st=PT.stats()||{},id=st.lastQuestionId;
  return Q.find(q=>q.id===id)||Q[Q.length-1];
}
function highlightResume(id){
  const card=document.querySelector('#app .card');
  if(!card)return;
  if(id)card.dataset.resumeTarget=id;
  card.classList.add('pt-resume-highlight');
  card.scrollIntoView({behavior:'smooth',block:'center'});
  setTimeout(()=>card.classList.remove('pt-resume-highlight'),2000);
}
function applyContinue(){
  if(!PTProgress.takeContinue('ap-calculus-limits-continuity'))return;
  const target=resumeQuestion();
  if(!target)return;
  flaggedReview=false;retryScope=null;retryCount=0;retryLabel='';shuffle=false;
  queue=Q.slice();
  const at=queue.findIndex(q=>q.id===target.id);
  i=at<0?0:at;
  show();highlightResume(target.id);
}
document.addEventListener('keydown',e=>{
  if(document.getElementById('pt-auth-gate')||document.getElementById('pt-auth-admin-modal')||document.getElementById('pt-stats-modal')||document.getElementById('pt-updates-modal')||document.getElementById('pt-settings-modal')||document.getElementById('zo'))return;
  if(!document.getElementById('pt-auth-flag'))return;
  const active=document.activeElement;
  if(active&&(/INPUT|TEXTAREA/.test(active.tagName)||active.isContentEditable))return;
  if(e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key.toUpperCase();
  if(k==='N'||e.key==='ArrowRight'){e.preventDefault();next();return}
  if(k==='P'||e.key==='ArrowLeft'){e.preventDefault();if(i>0){i--;show()}return}
  if(k==='F'){e.preventDefault();const fb=document.getElementById('pt-auth-flag');if(fb)fb.click();return}
  let letter=k;
  if(/^[1-4]$/.test(e.key))letter='ABCD'[Number(e.key)-1];
  if(document.querySelector('.choices')&&!answered&&'ABCD'.includes(letter)&&letter.length===1){e.preventDefault();pick(letter);return}
  if(e.key==='Enter'){const n=document.getElementById('next');if(n)n.click()}
});

PTAuth.init({
  onUnlock:function(){PT.restoreLocal();PT.loadCloud().then(function(){home();if(!applyLaunchFilter())applyContinue()})},
  onLock:function(){if(noteTimer){clearTimeout(noteTimer);noteTimer=null;noteDirtyId=''}answers={};flags={};lastQuestionId='';retryScope=null;retryCount=0;retryLabel='';flaggedReview=false}
});
document.addEventListener('pt-progress-reset',function(e){
  if(!e.detail||e.detail.testId!=='ap-calculus-limits-continuity')return;
  if(noteTimer){clearTimeout(noteTimer);noteTimer=null;noteDirtyId=''}
  answers={};flags={};lastQuestionId='';queue=[];i=0;
  retryScope=null;retryCount=0;retryLabel='';flaggedReview=false;shuffle=false;
  home();
});
home();
</script>
</body>
</html>
